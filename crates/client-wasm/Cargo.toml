[package]
name = "client-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
flower-core = { path = "../flower-core" }
wasm-bindgen = "0.2"
serde_yaml = "0.9"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
rapier2d = { version = "0.22", features = ["wasm-bindgen"] }
